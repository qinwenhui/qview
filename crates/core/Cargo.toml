[package]
name = "qview-core"
version.workspace = true
edition.workspace = true
description = "Core engine for qview — mmap, search, edit. UI-agnostic."
license.workspace = true
authors.workspace = true

[dependencies]
memmap2 = "0.9"
memchr = "2.7"
rayon = "1.10"
regex = "1.10"
regex-automata = "0.4"
parking_lot = "0.12"
lru = "0.12"
anyhow = "1"
crossbeam-channel = "0.5"
bincode = "1.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "qview_core"
path = "src/lib.rs"
