[package]
name = "qview-mcp"
version.workspace = true
edition.workspace = true
description = "qview 器灵的 MCP 边界 — server 把 qview 工具暴露给 Claude Desktop；client 把外部 MCP 工具桥接到 qview Agent。"
license.workspace = true
authors.workspace = true

[dependencies]
qview-core = { path = "../core" }
qview-application = { path = "../application" }
qview-agent = { path = "../agent" }
contexa = { git = "https://github.com/qinwenhui/contexa-rs", subdir = "crates/contexa" }
contexa-core = { git = "https://github.com/qinwenhui/contexa-rs", subdir = "crates/contexa-core" }
contexa-tools = { git = "https://github.com/qinwenhui/contexa-rs", subdir = "crates/contexa-tools" }
contexa-context = { git = "https://github.com/qinwenhui/contexa-rs", subdir = "crates/contexa-context" }
contexa-llm = { git = "https://github.com/qinwenhui/contexa-rs", subdir = "crates/contexa-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "io-std"] }
parking_lot = "0.12"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[features]
default = []
server = []
client = []

[lib]
name = "qview_mcp"
path = "src/lib.rs"

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["server"]
