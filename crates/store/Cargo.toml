[package]
name = "qview-store"
version.workspace = true
edition.workspace = true
description = "Local structured storage for qview — AI sessions/messages + file metadata. redb backend, pure Rust."
license.workspace = true
authors.workspace = true

[dependencies]
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[lib]
name = "qview_store"
path = "src/lib.rs"
