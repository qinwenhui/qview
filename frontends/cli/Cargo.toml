[package]
name = "qview"
version.workspace = true
edition.workspace = true
description = "Desktop log viewer — terminal UI with vim keys, syntax highlight"
license.workspace = true
authors.workspace = true

[[bin]]
name = "qview"
path = "src/main.rs"

[dependencies]
qview-core = { path = "../../crates/core" }
qview-application = { path = "../../crates/application" }
qview-agent = { path = "../../crates/agent" }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
memchr = "2.7"
rayon = "1.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
